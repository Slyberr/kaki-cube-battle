<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">


  <!-- Cube Rubik's (2x2 stylisé) -->
  <g transform="translate(-4,1) scale(1.8)">
    <!-- Face supérieure -->
    <polygon points="20,0 36,8 20,16 4,8" fill="whitesmoke" stroke="black" stroke-width="2" stroke-linejoin="round"/>
    <line x1="12" y1="4" x2="28" y2="12" stroke="black" stroke-width="1.5"/>
    <line x1="28" y1="4" x2="12" y2="12" stroke="black" stroke-width="1.5"/>

    <!-- Face gauche -->
    <polygon points="4,8 20,16 20,34 4,26" fill="blue" stroke="black" stroke-width="2" stroke-linejoin="round"/>
    <line x1="12" y1="12" x2="12" y2="30" stroke="black" stroke-width="1.5"/>
    <line x1="4" y1="17" x2="20" y2="25" stroke="black" stroke-width="1.5"/>

    <!-- Face droite -->
    <polygon points="20,16 36,8 36,26 20,34" fill="red" stroke="black" stroke-width="2" stroke-linejoin="round"/>
    <line x1="28" y1="12" x2="28" y2="30" stroke="black" stroke-width="1.5"/>
    <line x1="20" y1="25" x2="36" y2="17" stroke="black" stroke-width="1.5"/>
  </g>

<g transform="translate(-40,-20) scale(2.5)">
  <!-- Silhouettte d'oiseau dynamique posée sur le cube -->
  <!-- Tête et bec -->
  <path d="M 22,23 Q 26,12 34,14 L 40,15 L 35,18 Q 36,24 30,26 Z" fill="#edc618" />

  <!-- Aile en mouvement -->
  <path d="M 27,24 Q 18,18 20,28 Q 24,28 27,24 Z" fill="black" />
</g>
  <!-- Œil -->
  <circle cx="35" cy="20" r="2" fill="black" />
</svg>

